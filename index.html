<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3c49" />
  <meta name="description" content="LabOS - static LIMS / laboratory operations prototype" />
  <title>LabOS Prototype</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="labos-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <button class="brand" data-route="dashboard" aria-label="LabOS dashboard">
      <span class="brand-mark">L</span><span><strong>LabOS</strong><small>Laboratory Operations</small></span>
    </button>
    <div class="top-actions">
      <label class="searchbox"><span>⌕</span><input id="globalSearch" aria-label="Global search" placeholder="Search programme, test, DUT, prototype, asset…" autocomplete="off" /></label>
      <label class="role-select"><span>View as</span><select id="roleSelect" aria-label="Simulated role"><option>Technician</option><option>Test Engineer</option><option>Planner</option><option selected>Lab Manager</option><option>Quality</option></select></label>
      <button id="createBtn" class="btn primary top-create" aria-label="Create new laboratory work">＋ Create</button>
      <button id="settingsBtn" class="icon-btn" aria-label="Open administration and settings">⚙</button>
      <button id="mobileNavBtn" class="icon-btn mobile-only" aria-label="Open navigation">☰</button>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <nav id="nav">
        <button data-route="dashboard" class="active"><span>⌂</span>Home</button>
        <button data-route="validation"><span>◫</span>Validation</button>
        <button data-route="prototyping"><span>◇</span>Prototyping</button>
        <button data-route="planning"><span>▤</span>Planning</button>
        <button data-route="execution"><span>▶</span>Execution</button>
        <button data-route="lab"><span>⚙</span>Lab</button>
        <button data-route="quality"><span>◆</span>Quality</button>
        <button data-route="insights"><span>⌁</span>Insights</button>
      </nav>
      <div class="sidebar-foot"><span class="dot live"></span><span>Browser-local demo</span><small id="versionText"></small></div>
    </aside>
    <main id="main" tabindex="-1"><div class="loading">Loading LabOS…</div></main>
  </div>
  <div id="searchOverlay" class="search-overlay hidden" role="dialog" aria-modal="false" aria-label="Search results"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><button id="modalClose" class="modal-close" aria-label="Close">×</button><div id="modalBody"></div></div></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json" hidden />
  <script type="module" src="app.js"></script>
</body>
</html>
