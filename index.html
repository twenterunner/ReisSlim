<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3c49" />
  <meta name="description" content="LabOS - static LIMS / laboratory operations prototype" />
  <title>LabOS Prototype</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="labos-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <button class="brand" data-route="dashboard" aria-label="LabOS dashboard">
      <span class="brand-mark">L</span><span><strong>LabOS</strong><small>Laboratory Operations</small></span>
    </button>
    <div class="top-actions">
      <label class="searchbox"><span>⌕</span><input id="globalSearch" aria-label="Global search" placeholder="Search requirement, programme, DUT, asset…" autocomplete="off" /></label>
      <label class="role-select"><span>View as</span><select id="roleSelect" aria-label="Simulated role"><option>Technician</option><option>Test Engineer</option><option>Planner</option><option selected>Lab Manager</option><option>Quality</option></select></label>
      <button id="mobileNavBtn" class="icon-btn mobile-only" aria-label="Open navigation">☰</button>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <nav id="nav">
        <button data-route="dashboard" class="active"><span>▦</span>Dashboard</button>
        <button data-route="requirements"><span>⇅</span>Requirements & Coverage</button>
        <button data-route="specifications"><span>▣</span>Specs & Test Basis</button>
        <button data-route="programmes"><span>◫</span>Programmes</button>
        <button data-route="builder"><span>＋</span>Build Programme</button>
        <button data-route="planning"><span>▤</span>Test Planning</button>
        <button data-route="execution"><span>▶</span>Test Execution</button>
        <button data-route="quality"><span>◆</span>Quality / CAPA</button>
        <button data-route="custody"><span>⇄</span>Samples & Custody</button>
        <button data-route="guided"><span>☑</span>Guided Execution</button>
        <button data-route="live"><span>◉</span>Live Test Monitor</button>
        <button data-route="control"><span>⚠</span>Exceptions & Escalation</button>
        <button data-route="duts"><span>⬡</span>DUTs</button>
        <button data-route="library"><span>▧</span>Test Library</button>
        <button data-route="equipment"><span>⚙</span>Equipment</button>
        <button data-route="calibration"><span>◎</span>Calibration</button>
        <button data-route="metrology"><span>◌</span>Metrology & MSA</button>
        <button data-route="materials"><span>▱</span>Fixtures & Materials</button>
        <button data-route="external"><span>↗</span>External Labs</button>
        <button data-route="people"><span>♙</span>People & Skills</button>
        <button data-route="costs"><span>€</span>Cost & Finance</button>
        <button data-route="capacity"><span>▥</span>Demand & Capacity</button>
        <button data-route="twin"><span>◇</span>Planning Digital Twin</button>
        <button data-route="knowledge"><span>⌘</span>Knowledge & Similarity</button>
        <button data-route="maintenance"><span>◴</span>Maintenance Plan</button>
        <button data-route="audit"><span>✓</span>Audit & Compliance</button>
        <button data-route="analytics"><span>⌁</span>Reports / Analytics</button>
        <button data-route="admin"><span>⚒</span>Administration / Demo</button>
      </nav>
      <div class="sidebar-foot"><span class="dot live"></span><span>Browser-local demo</span><small id="versionText"></small></div>
    </aside>
    <main id="main" tabindex="-1"><div class="loading">Loading LabOS…</div></main>
  </div>
  <div id="searchOverlay" class="search-overlay hidden" role="dialog" aria-modal="false" aria-label="Search results"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><button id="modalClose" class="modal-close" aria-label="Close">×</button><div id="modalBody"></div></div></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json" hidden />
  <script type="module" src="app.js"></script>
</body>
</html>
